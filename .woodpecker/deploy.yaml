# Woodpecker Pipeline configuration for Astro & Bun
# Triggers only when pushing to your main branch
when:
  branch: main
  event: push

steps:
  build-project:
    image: oven/bun:latest
    commands:
      - bun install --frozen-lockfile
      # Directs astro.config.mjs to use codeberg parameters
      - DEPLOY_TARGET=codeberg bun run build

  deploy-pages:
    image: bitnami/git:latest
    secrets: [codeberg_token]
    commands:
      - git config --global user.email "woodpecker-ci@noreply.codeberg.org"
      - git config --global user.name "Woodpecker CI"
      # Explicitly navigate into the compiled directory tree
      - cd dist
      # Initialize local tracking
      - git init
      - git checkout -b pages
      - git add --all
      - 'git commit -m "ci: production deploy via woodpecker" --allow-empty'
      # Bypass the credential helper and inject the token explicitly
      # (We add 'token:' as a dummy username so git reads the string as token auth)
      - git remote add target https://token:$CODEBERG_TOKEN@codeberg.org/$CI_REPO.git
      - git push -f target pages
