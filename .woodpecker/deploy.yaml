# Woodpecker Pipeline configuration for Astro & Bun
# Triggers only when pushing to your main branch
when:
  branch: main
  event: push

steps:
  build-project:
    image: oven/bun:latest
    environment:
      DEPLOY_TARGET: codeberg
    commands:
      - bun install --frozen-lockfile
      - bun run build

  deploy-pages:
    image: alpine/git:latest
    secrets: [codeberg_token]
    commands:
      - cd dist

      - git init
      - git config --global user.email "woodpecker-ci@noreply.codeberg.org"
      - git config --global user.name "Woodpecker CI"
      - git add .
      - 'git commit -m "ci: production deploy via woodpecker [skip ci]" --allow-empty'
      - git push --force https://${CI_REPO_OWNER}:$CODEBERG_TOKEN@codeberg.org/${CI_REPO}.git main:pages
